<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href="style.css">
    <title>Document</title>

    <!--Jost Font, de Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div id="divMae">
        
        <header class="banner">
            <p>Gato Clicker</p>
            <nav class="linksBanner">
                <a href="index.html">Jogo</a>
                <a href="sobre.html">Sobre</a>
            </nav>
        </header>

        <div id="container">
            <div>
                <p class="titulos">Nome: <span id="nomeGato"> Dorivaldo </span> </p>
                <p class="titulos">cliques: <span id="quantidadeCliques">0</span> </p>
                <img src="https://png.pngtree.com/png-vector/20250919/ourmid/pngtree-beautiful-ragdoll-cat-with-striking-blue-eyes-sitting-elegantly-isolated-on-png-image_17502891.webp"
                id="bloco" onclick='incrementarCliques()'
> 
                </img>   
            </div>
            
            <div id="upgrades">
                <div id="tituloUpgrades" class="titulos">
                    <p>Upgrades</p>
                    <p>Custo</p>
                </div>
                
                <script type="module">
                    import {upgrades} from './script.js';

                    const container = document.getElementById('upgrades');

                    window.fecharModal = function() {
                        document.getElementById('meuModal').classList.remove('mostrar');
                    }

                    upgrades.forEach(card =>{
                        const cardUpgrade =`
                            <div class= "cardContainer">
                                <div class="cardUpgrades">
                                    <p>${card.titulo}</p>
                                    <p>${card.custo}</p>
                                </div>
                                <button class="botao" data-desc="${card.description}">
                                    Sobre
                                </button>
                            </div>
                        `;

                        container.innerHTML += cardUpgrade;
                    });
                </script>
            </div>
        </div>
       
    </div>
    <div id="modal" class="modalFundo">
        <div class="modalConteudo">
            <h3 id="modalTitulo">Upgrade</h3>
            <p id="modalCorpo"></p>
            <button onclick="fecharModal()" class="botao-fechar">Entendi!</button>
        </div>
    </div>
    <script type='module' src="script.js"> </script>
</body>
</html>
